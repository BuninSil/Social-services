<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06070f">
<meta name="description" content="NEONHUB — соцсеть сообщества Mobile Legends: Bang Bang">
<title>NEONHUB · MLBB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2306070f'/><path d='M9 23V9l14 14V9' stroke='%23ffc64b' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="#/" aria-label="NEONHUB — в ленту">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M9 23V9l14 14V9" fill="none" stroke="currentColor" stroke-width="2.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand__text">NEON<b>HUB</b></span>
    </a>

    <form class="search" id="search-form" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="search-input" type="search" placeholder="Поиск по постам, тегам и героям" aria-label="Поиск" autocomplete="off">
    </form>

    <nav class="topbar__actions" id="auth-slot"></nav>
    <button class="icon-btn topbar__menu" id="menu-toggle" aria-label="Разделы">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
  </div>
  <div class="topbar__beam" aria-hidden="true"></div>
</header>

<main class="layout">
  <aside class="rail rail--left" id="rail-left">
    <nav class="panel">
      <h2 class="panel__title">Навигация</h2>
      <ul class="navlist" id="navlist"></ul>
    </nav>
    <section class="panel">
      <h2 class="panel__title">Разделы</h2>
      <ul class="channels" id="channel-list"></ul>
    </section>
    <section class="panel panel--quiet">
      <h2 class="panel__title">Сортировка</h2>
      <div class="segmented" id="sort-switch" role="tablist">
        <button role="tab" data-sort="hot">Горячее</button>
        <button role="tab" data-sort="new">Свежее</button>
        <button role="tab" data-sort="top">Топ</button>
      </div>
    </section>
    <p class="rail__foot">Демо-аккаунты: <code>Savage</code> (админ),<br><code>Turtle</code> (модератор) · пароль <code>demo1234</code></p>
  </aside>

  <section class="content" id="view"></section>

  <aside class="rail rail--right">
    <section class="panel">
      <h2 class="panel__title">Пульс сервера</h2>
      <div class="stats" id="stats-grid"></div>
    </section>
    <section class="panel">
      <h2 class="panel__title">Часто обсуждают</h2>
      <div class="tagcloud" id="trending"></div>
    </section>
    <section class="panel">
      <h2 class="panel__title">Герои в постах</h2>
      <div class="tagcloud" id="top-heroes"></div>
    </section>
    <section class="panel">
      <h2 class="panel__title">Топ по карме</h2>
      <ul class="leaders" id="leaders"></ul>
    </section>
  </aside>
</main>

<button class="fab" id="compose-fab" aria-label="Новый пост">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="modal" id="modal" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="icon-btn modal__close" data-close aria-label="Закрыть">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <h2 class="modal__title" id="modal-title"></h2>
    <div id="modal-body"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
